<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Redirecionando… · SULLAB</title>

<style>
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#eef2f7;color:#1a2433;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.box{background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(20,40,70,.10);padding:34px 28px;max-width:440px;margin:16px}
img{height:46px;border-radius:8px;margin-bottom:8px}
h1{font-size:19px;color:#1f3c73;margin:6px 0 4px}
p{color:#5a6b80;font-size:14px;line-height:1.5;margin:0 0 16px}
.spin{width:34px;height:34px;border:3px solid #e3ecf6;border-top-color:#2f9e63;border-radius:50%;animation:s .8s linear infinite;margin:14px auto}
@keyframes s{to{transform:rotate(360deg)}}
a.btn{display:inline-block;background:#2f9e63;color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;font-size:15px}
.small{font-size:12px;color:#9aa7ba;margin-top:14px}
</style>
<script defer src="/rastreio.js?v=11"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head>
<body>
<div class="box">
<img src="https://lojasullabrj.com.br/og-sullab.png" alt="SULLAB" width="88" height="46">
<h1>Estamos te levando ao produto certo…</h1>
<p>Nosso site foi renovado. Aguarde um instante que já te levamos para o lugar certo.</p>
<div class="spin"></div>
<a class="btn" id="goLink" href="https://lojasullabrj.com.br/">Ir para a loja agora</a>
<div class="small">SULLAB · Produtos para laboratório · NF-e · preço CNPJ</div>
</div>

<script>
(function(){
  var seg = '';
  try { seg = decodeURIComponent((location.pathname||'').toLowerCase()); } catch(e) { seg = (location.pathname||'').toLowerCase(); }
  /* 15/11/2026: tira ".html"/".htm"/".php" do endereço antigo (antes ia junto para a busca e dava "nenhum produto") */
  seg = seg.replace(/^\/+|\/+$/g,'').replace(/\.(html?|php|aspx?)$/,'');

  /* páginas que mudaram de lugar */
  var MAPA = {
    'equipamentos-comodato':'/categoria/equipamentos-de-bioquimica.html',
    'equipamentos comodato':'/categoria/equipamentos-de-bioquimica.html',
    'equipamentos_comodato':'/categoria/equipamentos-de-bioquimica.html',
    'comodato':'/categoria/equipamentos-de-bioquimica.html'
  };
  var ultimo = seg.split('/').filter(Boolean).pop() || '';
  if (MAPA[seg] || MAPA[ultimo]) { location.replace(MAPA[seg] || MAPA[ultimo]); return; }

  var MARCAS = ['descarpack','cral','cralplast','biocon','uniqmed','kasvi','newprov','labtest','bioclin','vacuette','greiner','firstlab','olen','prolab','global','medix','bd','injex','labor import','laborimport'];

  var termo = seg;

  var mp = seg.match(/produtos?\/([^\/]+)/);
  if (mp) {
    termo = mp[1];
  } else {
    var parts = seg.split('/').filter(Boolean);
    if (parts.length >= 2 && MARCAS.indexOf(parts[0]) !== -1) {
      termo = parts[1];
    } else {
      termo = parts[parts.length - 1] || seg;
    }
  }

  termo = termo
    .replace(/-/g,' ')
    .replace(/\b(c\/?\d+|pacote com \d+|\d+ml|\d+un|\d+und|und|ref|cod|com \d+|\d{3,})\b/gi,' ')
    .replace(/(\w)1$/,'$1')          
    .replace(/\s+/g,' ')
    .trim();

  var dest = (termo && termo.length >= 3) ? ('/?q=' + encodeURIComponent(termo)) : '/';
  try { document.getElementById('goLink').href = 'https://lojasullabrj.com.br' + dest; } catch(e){}

  /* 15/11/2026: antes de cair na busca, procura no sitemap uma página de produto com o mesmo nome do link antigo */
  var foi = false;
  function ir(u){ if (foi) return; foi = true; location.replace(u); }
  function sem(s){ try { return s.normalize('NFD').replace(/[̀-ͯ]/g,''); } catch(e){ return s; } }
  var PARE = {de:1,da:1,do:1,das:1,dos:1,com:1,para:1,em:1,e:1,c:1,p:1,un:1,und:1,cx:1,caixa:1,html:1};
  var palavras = sem(seg.split('/').pop() || '').split(/[^a-z0-9]+/).filter(function(w){ return w && w.length >= 2 && !PARE[w]; });
  if (palavras.length >= 3 && window.fetch) {
    var tempo = setTimeout(function(){ ir(dest); }, 2500);
    fetch('/sitemap-produtos.xml').then(function(r){ return r.text(); }).then(function(xml){
      var re = /<loc>[^<]*\/p\/([^<]+)\.html<\/loc>/g, m, melhor = null, nota = 0;
      while ((m = re.exec(xml))) {
        var ws = m[1].split('-'), tem = {}, i, ok = 0;
        for (i = 0; i < ws.length; i++) tem[ws[i]] = 1;
        for (i = 0; i < palavras.length; i++) if (tem[palavras[i]]) ok++;
        var n = ok / palavras.length;
        if (n > nota) { nota = n; melhor = m[1]; }
      }
      clearTimeout(tempo);
      ir((melhor && nota >= 0.8) ? ('/p/' + melhor + '.html') : dest);
    }).catch(function(){ clearTimeout(tempo); ir(dest); });
  } else {
    setTimeout(function(){ ir(dest); }, 600);
  }
})();
</script>
</body>
</html>
